# tmux - Stow package tmux/.config/tmux/tmux.conf -> ~/.config/tmux/tmux.conf (XDG, tmux 3.4)
# fallback if needed: ln -s ~/.config/tmux/tmux.conf ~/.tmux.conf

# --- prefix - C-a ---
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf"

# --- general ---
set -g default-terminal "tmux-256color"
# true color if terminal supports it (ghostty/kitty/wezterm/alacritty)
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc,alacritty:Tc"
set -g mouse on
set -g history-limit 50000
set -g display-time 3000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g escape-time 0
set -g status-interval 5
# use $SHELL not hardcoded
set -g default-shell "$SHELL"

# --- copy / clipboard - OSC 52 works on macOS/Linux/WSL (ghostty/kitty); no xclip needed ---
set -g set-clipboard on
# vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- panes / navigation - vim-like ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# split keep cwd
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# toggle previous window
bind -r ^ last-window
# open TODO.md in nvim
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim \"$HOME/Development/github.com/kerimovkhikmet/dotfiles/TODO.md\""
# sessionizer - generic (see bin/.local/bin/tmux-sessionizer, needs fzf)
bind -r f run-shell "~/.local/bin/tmux-sessionizer"

# --- platform - generic linux-gnu for now (no WSL special-case) ---
# macOS: reattach-to-user-namespace if needed (uncomment on darwin)
# if-shell "uname | grep -q Darwin" "set -g default-command 'reattach-to-user-namespace -l $SHELL'"

# --- plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'rose-pine/tmux'

set -g @rose_pine_variant 'moon'
set -g @rose_pine_host 'on'
set -g @rose_pine_date_time ''
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_only_windows 'on'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_default_window_behavior 'on'
set -g @rose_pine_show_current_program 'on'
set -g @rose_pine_show_pane_directory 'on'
set -g @rose_pine_left_separator ' > '
set -g @rose_pine_right_separator ' < '
set -g @rose_pine_field_separator ' | '
set -g @rose_pine_window_separator ' - '
set -g @rose_pine_session_icon ''
set -g @rose_pine_current_window_icon ''
set -g @rose_pine_folder_icon ''
set -g @rose_pine_username_icon ''
set -g @rose_pine_hostname_icon '󰒋'
set -g @rose_pine_date_time_icon '󰃰'
set -g @rose_pine_window_status_separator "  "
set -g @rose_pine_prioritize_windows 'on'
set -g @rose_pine_width_to_hide '80'
set -g @rose_pine_window_count '5'

# --- TPM init (keep at the end; install.sh clones to ~/.tmux/plugins/tpm) ---
run '~/.tmux/plugins/tpm/tpm'
