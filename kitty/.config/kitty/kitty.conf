# kitty - Stow package kitty/.config/kitty/kitty.conf -> ~/.config/kitty/kitty.conf
# matches ghostty Rose Pine Moon, used occasionally (ghostty canonical)
# see: https://sw.kovidgoyal.net/kitty/conf/

# --- font - keep $HOME portable, Nerd Font ---
font_family FiraCode Nerd Font Mono
font_size 12.0
adjust_line_height 0
adjust_column_width 0

# --- theme - Rose Pine Moon (closest to ghostty's `theme = Rose Pine Moon`) ---
# kitty's rose-pine is built-in? use color_scheme or manual include
# for full theme, run: kitty +kitten themes --reload-in=all Rose Pine Moon
background #232136
foreground #e0def4
cursor #ebbcba
cursor_text_color #232136
selection_background #2a273f
selection_foreground #e0def4

# --- cursor ---
cursor_shape block
cursor_beam_thickness 2.0
cursor_blink_interval 0

# --- window / padding - ghostty-like ---
window_padding_width 8
hide_window_decorations no
confirm_os_window_close 0

# --- terminal: xterm-256color, true color ---
term xterm-256color

# --- keep $HOME portable - no hardcoded /home/khikmetkerimov ---
